# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:2003825}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS (handled in WebConfig, but keep frontend origin here for reference)
app.frontend.url=http://localhost:3000

# JWT
app.jwt.secret=car-rental-system-super-secret-signing-key-2026-change-me-in-production
app.jwt.expiration-ms=86400000

# Seeded admin account (created automatically on first startup if it doesn't exist)
app.admin.email=admin@drivenow.com
app.admin.password=Admin@123
app.admin.full-name=System Administrator

# Logging
logging.level.org.springframework=INFO
logging.level.com.carrental=DEBUG
